name: Backup databases
on:
  workflow_dispatch:
  schedule:
    # Runs Every day at 4:00am UTC
    - cron: "00 5 * * *"

jobs:
  backup-databases:
    name: Backup databases
    steps:
      fly machine run -a ppbb-db-backup-worker --region=iad --restart=no --rm ghcr.io/significa/fly-pg-dump-to-s3
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
